<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel — Classement de la bande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEAE0;
    --bg-elevated:#FFFFFF;
    --ink:#16262B;
    --ink-soft:#5C6C70;
    --court:#0F6E6A;
    --court-dark:#0A4F4C;
    --ball:#D7F238;
    --ball-ink:#3A4A0E;
    --line:#DDD6C6;
    --danger:#C1512D;
    --radius:16px;
    --win-bg: rgba(215,242,56,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:20px 16px 60px;}

  /* Header */
  .header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;padding:0 2px;}
  .wordmark{font-family:'Anton';font-size:38px;letter-spacing:1px;color:var(--court-dark);line-height:1;}
  .wordmark span{color:var(--court);}
  .tagline{font-size:12px;color:var(--ink-soft);font-weight:500;text-align:right;max-width:150px;line-height:1.3;}

  /* Tabs */
  .tabs{display:flex;background:var(--bg-elevated);border-radius:999px;padding:4px;margin-bottom:20px;border:1px solid var(--line);}
  .tab-btn{flex:1;border:none;background:transparent;padding:10px 8px;font-family:'Space Grotesk';font-weight:600;font-size:14px;border-radius:999px;cursor:pointer;color:var(--ink-soft);transition:all .15s ease;}
  .tab-btn.active{background:var(--court);color:#fff;}

  .card{background:var(--bg-elevated);border-radius:var(--radius);border:1px solid var(--line);padding:18px;margin-bottom:16px;}
  .card h2{font-family:'Anton';font-weight:400;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:var(--court-dark);margin:0 0 12px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:-6px;margin-bottom:12px;}

  /* Date input */
  input[type=date], input[type=text]{
    font-family:'Space Grotesk';
    font-size:15px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  input[type=date]:focus, input[type=text]:focus{outline:2px solid var(--court);outline-offset:1px;}

  /* Player chips */
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{
    font-family:'Space Grotesk';font-weight:600;font-size:14px;
    padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;transition:all .12s ease;
    user-select:none;
  }
  .chip:hover{border-color:var(--court);}
  .chip.selected{background:var(--court);border-color:var(--court);color:#fff;}
  .chip.disabled{opacity:.35;cursor:not-allowed;}
  .chip.add-new{border-style:dashed;color:var(--court-dark);background:transparent;}

  .new-player-row{display:flex;gap:8px;margin-top:6px;}
  .new-player-row input{flex:1;}
  .btn-small{
    font-family:'Space Grotesk';font-weight:700;font-size:13px;
    padding:9px 14px;border-radius:10px;border:none;
    background:var(--court);color:#fff;cursor:pointer;white-space:nowrap;
  }
  .btn-small:hover{background:var(--court-dark);}

  .selection-counter{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
  .selection-counter b{color:var(--court-dark);}

  /* Winner toggles */
  .winner-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .winner-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;cursor:pointer;transition:all .12s ease;font-weight:600;
  }
  .winner-row.selected{background:var(--win-bg);border-color:var(--ball-ink);}
  .winner-row .ball{opacity:0;font-size:15px;transition:opacity .1s;}
  .winner-row.selected .ball{opacity:1;}

  .btn-main{
    width:100%;font-family:'Space Grotesk';font-weight:700;font-size:15px;
    padding:13px;border-radius:12px;border:none;margin-top:8px;
    background:var(--ball);color:var(--ball-ink);cursor:pointer;transition:all .12s ease;
  }
  .btn-main:disabled{background:var(--line);color:#9a9a8f;cursor:not-allowed;}
  .btn-main:not(:disabled):hover{filter:brightness(0.95);}

  /* Match list / scoreboard cards */
  .match-card{
    background:var(--bg-elevated);border-radius:12px;border:1px solid var(--line);
    padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;
  }
  .match-teams{display:flex;align-items:center;gap:8px;font-size:13.5px;}
  .team{display:flex;flex-direction:column;gap:1px;padding:6px 10px;border-radius:8px;min-width:70px;}
  .team.win{background:var(--win-bg);}
  .team .p{font-weight:600;}
  .vs{font-family:'Anton';color:var(--ink-soft);font-size:12px;padding:0 2px;}
  .del-btn{border:none;background:transparent;color:var(--danger);font-size:18px;cursor:pointer;line-height:1;padding:4px 6px;}
  .empty-state{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:18px 8px;}

  /* Segmented control for classement */
  .seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;margin-bottom:14px;border:1px solid var(--line);}
  .seg-btn{flex:1;border:none;background:transparent;padding:8px 6px;font-size:13px;font-weight:600;border-radius:999px;cursor:pointer;color:var(--ink-soft);}
  .seg-btn.active{background:var(--court-dark);color:#fff;}

  .period-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
  .period-nav button{border:none;background:var(--bg-elevated);border:1px solid var(--line);width:32px;height:32px;border-radius:999px;cursor:pointer;font-size:15px;color:var(--court-dark);font-weight:700;}
  .period-nav button:hover{background:var(--court);color:#fff;}
  .period-label{font-weight:600;font-size:13.5px;color:var(--ink-soft);min-width:170px;text-align:center;}

  /* Podium */
  .podium{display:flex;align-items:flex-end;gap:8px;justify-content:center;margin-bottom:20px;padding:0 4px;}
  .podium-col{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;}
  .podium-name{font-weight:700;font-size:13px;margin-bottom:4px;text-align:center;word-break:break-word;}
  .podium-pct{font-family:'Anton';font-size:20px;color:var(--court-dark);}
  .podium-bar{width:100%;border-radius:10px 10px 0 0;margin-top:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:'Anton';color:#fff;font-size:13px;}
  .rank-1 .podium-bar{height:86px;background:linear-gradient(180deg,var(--ball),#B9CC1E);}
  .rank-1 .podium-bar{color:var(--ball-ink);}
  .rank-2 .podium-bar{height:64px;background:#9AA5A2;}
  .rank-3 .podium-bar{height:48px;background:#C08A5A;}

  /* Ranking list */
  .rank-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-num{font-family:'Anton';font-size:15px;color:var(--ink-soft);width:20px;text-align:center;flex-shrink:0;}
  .rank-info{flex:1;min-width:0;}
  .rank-name{font-weight:700;font-size:14.5px;}
  .rank-sub{font-size:11.5px;color:var(--ink-soft);}
  .rank-bar-track{background:var(--bg);border-radius:6px;height:6px;margin-top:5px;overflow:hidden;}
  .rank-bar-fill{height:100%;background:var(--court);border-radius:6px;}
  .rank-pct{font-family:'Anton';font-size:16px;color:var(--court-dark);width:52px;text-align:right;flex-shrink:0;}

  .loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13.5px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loadingMsg">Chargement des données…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  let data = { players: [], matches: [] };
  let ready = false;
  let saveTimer = null;

  // UI state
  let activeTab = 'add'; // 'add' | 'stats'
  let selectedDate = todayStr();
  let selectedPlayers = []; // ids, up to 4
  let selectedWinners = []; // ids, up to 2
  let newPlayerName = '';
  let statsFilter = 'general'; // 'general' | 'week' | 'month'
  let weekOffset = 0;
  let monthOffset = 0;

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  // ---------- Supabase (base de données partagée) ----------
  // ⚠️ Remplace les valeurs ci-dessous par celles de TON projet Supabase
  // (Project Settings > API > Project URL / anon public key)
  const SUPABASE_URL = "https://qealokzjeeqfkzeiepfw.supabase.co/"; // ex: https://xxxxx.supabase.co
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlYWxva3pqZWVxZmt6ZWllcGZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTY1MDQsImV4cCI6MjEwMzY3MjUwNH0.ZQtTsnlOTHrrYS1DfOsERSUNwfxMQET2QeyxQ6xrkT8";
  const ROW_ID = "main"; // identifiant fixe de la ligne unique qui stocke tout

  let supabase = null;

  function initSupabase(){
    if(SUPABASE_URL === "REMPLACE_MOI"){
      document.getElementById('app').innerHTML =
        '<div class="loading">⚠️ Configuration Supabase manquante.<br>Ouvre le fichier HTML et remplace SUPABASE_URL / SUPABASE_ANON_KEY par ceux de ton projet (voir les instructions fournies).</div>';
      return;
    }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    loadInitial();

    // Écoute en temps réel : dès qu'un copain enregistre une partie,
    // tout le monde voit la mise à jour automatiquement, sans recharger.
    supabase
      .channel('padel_state_changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'padel_state', filter: `id=eq.${ROW_ID}` },
        (payload) => {
          const val = payload.new && payload.new.data;
          if(val){
            data.players = val.players || [];
            data.matches = val.matches || [];
            render();
          }
        }
      )
      .subscribe();
  }

  async function loadInitial(){
    try{
      const { data: rows, error } = await supabase
        .from('padel_state')
        .select('data')
        .eq('id', ROW_ID)
        .maybeSingle();
      if(error) throw error;
      if(rows && rows.data){
        data.players = rows.data.players || [];
        data.matches = rows.data.matches || [];
      } else {
        // Aucune ligne encore : on la crée avec des données vides
        await supabase.from('padel_state').insert({ id: ROW_ID, data: { players: [], matches: [] } });
      }
      ready = true;
      render();
    }catch(e){
      console.error('Erreur Supabase', e);
      document.getElementById('app').innerHTML =
        '<div class="loading">⚠️ Impossible de se connecter à la base de données. Vérifie ton URL/clé Supabase, que la table padel_state existe, et les policies RLS.</div>';
    }
  }

  async function save(){
    if(!supabase) return;
    try{
      const { error } = await supabase
        .from('padel_state')
        .upsert({ id: ROW_ID, data: data, updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(e){
      console.error('Erreur de sauvegarde', e);
    }
  }

  // ---------- Date helpers ----------
  function parseDate(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function fmtISO(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getWeekRange(offset){
    const d = new Date();
    d.setDate(d.getDate() + offset*7);
    const day = (d.getDay()+6)%7; // 0=Mon
    const monday = new Date(d); monday.setDate(d.getDate()-day);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return {start: monday, end: sunday};
  }
  function getMonthRange(offset){
    const d = new Date();
    const m = new Date(d.getFullYear(), d.getMonth()+offset, 1);
    const start = new Date(m.getFullYear(), m.getMonth(), 1);
    const end = new Date(m.getFullYear(), m.getMonth()+1, 0);
    return {start, end};
  }
  const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  function fmtDayMonth(d){ return d.getDate() + ' ' + MOIS[d.getMonth()]; }
  function fmtWeekLabel(range){
    const sameMonth = range.start.getMonth()===range.end.getMonth();
    if(sameMonth){
      return range.start.getDate() + ' – ' + range.end.getDate() + ' ' + MOIS[range.end.getMonth()] + ' ' + range.end.getFullYear();
    }
    return fmtDayMonth(range.start) + ' – ' + fmtDayMonth(range.end) + ' ' + range.end.getFullYear();
  }
  function fmtMonthLabel(range){
    return MOIS[range.start.getMonth()].charAt(0).toUpperCase()+MOIS[range.start.getMonth()].slice(1) + ' ' + range.start.getFullYear();
  }
  function fmtDateHuman(s){
    const d = parseDate(s);
    return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ---------- Data helpers ----------
  function playerName(id){
    const p = data.players.find(p=>p.id===id);
    return p ? p.name : '?';
  }
  function addPlayer(name){
    name = name.trim();
    if(!name) return null;
    const existing = data.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(existing) return existing.id;
    const p = {id: uid(), name};
    data.players.push(p);
    return p.id;
  }
  function togglePlayerSelect(id){
    const idx = selectedPlayers.indexOf(id);
    if(idx>-1){
      selectedPlayers.splice(idx,1);
      selectedWinners = selectedWinners.filter(w=>w!==id);
    } else {
      if(selectedPlayers.length>=4) return;
      selectedPlayers.push(id);
    }
    render();
  }
  function toggleWinner(id){
    const idx = selectedWinners.indexOf(id);
    if(idx>-1){
      selectedWinners.splice(idx,1);
    } else {
      if(selectedWinners.length>=2) return;
      selectedWinners.push(id);
    }
    render();
  }
  function resetMatchForm(){
    selectedPlayers = [];
    selectedWinners = [];
    newPlayerName = '';
  }
  async function saveMatch(){
    if(selectedPlayers.length!==4 || selectedWinners.length!==2) return;
    data.matches.push({
      id: uid(),
      date: selectedDate,
      players: [...selectedPlayers],
      winners: [...selectedWinners]
    });
    resetMatchForm();
    await save();
    render();
  }
  async function deleteMatch(id){
    data.matches = data.matches.filter(m=>m.id!==id);
    await save();
    render();
  }

  function computeStats(matches, playersList){
    return playersList.map(p=>{
      const played = matches.filter(m=>m.players.includes(p.id)).length;
      const wins = matches.filter(m=>m.winners.includes(p.id)).length;
      const ratio = played>0 ? wins/played : null;
      return {id:p.id, name:p.name, played, wins, ratio};
    }).sort((a,b)=>{
      if(a.ratio===null && b.ratio===null) return a.name.localeCompare(b.name);
      if(a.ratio===null) return 1;
      if(b.ratio===null) return -1;
      if(b.ratio!==a.ratio) return b.ratio-a.ratio;
      if(b.played!==a.played) return b.played-a.played;
      return a.name.localeCompare(b.name);
    });
  }

  // ---------- Render ----------
  function render(){
    const app = document.getElementById('app');
    if(!ready){ app.innerHTML = '<div class="loading">Chargement des données…</div>'; return; }

    let html = '';
    html += '<div class="header">';
    html += '  <div class="wordmark">PADEL<span>.</span></div>';
    html += '  <div class="tagline">Le classement<br>de la bande</div>';
    html += '</div>';

    html += '<div class="tabs">';
    html += `<button class="tab-btn ${activeTab==='add'?'active':''}" data-action="tab" data-tab="add">Nouvelle partie</button>`;
    html += `<button class="tab-btn ${activeTab==='stats'?'active':''}" data-action="tab" data-tab="stats">Classement</button>`;
    html += '</div>';

    if(activeTab==='add'){
      html += renderAddTab();
    } else {
      html += renderStatsTab();
    }

    app.innerHTML = html;
    bindEvents();
  }

  function renderAddTab(){
    let h = '';

    // Date
    h += '<div class="card">';
    h += '<h2>Quel jour ?</h2>';
    h += `<input type="date" id="dateInput" value="${selectedDate}">`;
    h += '</div>';

    // Players
    h += '<div class="card">';
    h += '<h2>Les 4 joueurs</h2>';
    h += `<div class="selection-counter"><b>${selectedPlayers.length}</b>/4 joueurs sélectionnés</div>`;
    h += '<div class="chip-grid">';
    data.players.forEach(p=>{
      const sel = selectedPlayers.includes(p.id);
      const disabled = !sel && selectedPlayers.length>=4;
      h += `<button class="chip ${sel?'selected':''} ${disabled?'disabled':''}" data-action="pick" data-id="${p.id}">${escapeHtml(p.name)}</button>`;
    });
    h += '</div>';
    if(data.players.length===0){
      h += "<div class=\"hint\">Aucun joueur pour l'instant — ajoutez le premier ci-dessous.</div>";
    }
    h += '<div class="new-player-row">';
    h += `<input type="text" id="newPlayerInput" placeholder="Prénom du nouveau joueur" value="${escapeHtml(newPlayerName)}">`;
    h += '<button class="btn-small" data-action="addPlayer">Ajouter</button>';
    h += '</div>';
    h += '</div>';

    // Winners
    if(selectedPlayers.length===4){
      h += '<div class="card">';
      h += '<h2>Qui a gagné ?</h2>';
      h += `<div class="selection-counter"><b>${selectedWinners.length}</b>/2 gagnants sélectionnés</div>`;
      h += '<div class="winner-grid">';
      selectedPlayers.forEach(id=>{
        const sel = selectedWinners.includes(id);
        h += `<div class="winner-row ${sel?'selected':''}" data-action="win" data-id="${id}"><span>${escapeHtml(playerName(id))}</span><span class="ball">🎾 gagné</span></div>`;
      });
      h += '</div>';
      const canSave = selectedWinners.length===2;
      h += `<button class="btn-main" data-action="save" ${canSave?'':'disabled'}>Enregistrer la partie</button>`;
      h += '</div>';
    }

    // Matches of the day
    const dayMatches = data.matches.filter(m=>m.date===selectedDate);
    h += '<div class="card">';
    h += `<h2>Parties du ${fmtDateHuman(selectedDate)}</h2>`;
    if(dayMatches.length===0){
      h += "<div class=\"empty-state\">Aucune partie enregistrée ce jour-là pour l'instant.</div>";
    } else {
      dayMatches.forEach(m=>{
        const w = m.winners, l = m.players.filter(id=>!w.includes(id));
        h += '<div class="match-card">';
        h += '<div class="match-teams">';
        h += `<div class="team win"><span class="p">${escapeHtml(playerName(w[0]))}</span><span class="p">${escapeHtml(playerName(w[1]))}</span></div>`;
        h += '<div class="vs">VS</div>';
        h += `<div class="team"><span class="p">${escapeHtml(playerName(l[0]))}</span><span class="p">${escapeHtml(playerName(l[1]))}</span></div>`;
        h += '</div>';
        h += `<button class="del-btn" data-action="delMatch" data-id="${m.id}" title="Supprimer">✕</button>`;
        h += '</div>';
      });
    }
    h += '</div>';

    return h;
  }

  function renderStatsTab(){
    let h = '';
    h += '<div class="seg">';
    h += `<button class="seg-btn ${statsFilter==='general'?'active':''}" data-action="filter" data-filter="general">Général</button>`;
    h += `<button class="seg-btn ${statsFilter==='week'?'active':''}" data-action="filter" data-filter="week">Semaine</button>`;
    h += `<button class="seg-btn ${statsFilter==='month'?'active':''}" data-action="filter" data-filter="month">Mois</button>`;
    h += '</div>';

    let matches = data.matches;
    if(statsFilter==='week'){
      const range = getWeekRange(weekOffset);
      matches = data.matches.filter(m=>{ const d=parseDate(m.date); return d>=range.start && d<=range.end; });
      h += '<div class="period-nav">';
      h += '<button data-action="periodPrev">‹</button>';
      h += `<div class="period-label">${fmtWeekLabel(range)}</div>`;
      h += `<button data-action="periodNext" ${weekOffset>=0?'disabled style="opacity:.3;cursor:default;"':''}>›</button>`;
      h += '</div>';
    } else if(statsFilter==='month'){
      const range = getMonthRange(monthOffset);
      matches = data.matches.filter(m=>{ const d=parseDate(m.date); return d>=range.start && d<=range.end; });
      h += '<div class="period-nav">';
      h += '<button data-action="periodPrev">‹</button>';
      h += `<div class="period-label">${fmtMonthLabel(range)}</div>`;
      h += `<button data-action="periodNext" ${monthOffset>=0?'disabled style="opacity:.3;cursor:default;"':''}>›</button>`;
      h += '</div>';
    }

    const stats = computeStats(matches, data.players);
    const withGames = stats.filter(s=>s.played>0);

    if(data.players.length===0){
      h += '<div class="card"><div class="empty-state">Ajoutez des joueurs et des parties pour voir apparaître le classement.</div></div>';
      return h;
    }
    if(withGames.length===0){
      h += '<div class="card"><div class="empty-state">Aucune partie enregistrée sur cette période.</div></div>';
      return h;
    }

    // Podium only for general view with at least 3 ranked players
    if(statsFilter==='general' && withGames.length>=3){
      const top3 = withGames.slice(0,3);
      const order = [1,0,2]; // display order: 2nd, 1st, 3rd
      h += '<div class="podium">';
      order.forEach(i=>{
        if(!top3[i]) return;
        const s = top3[i];
        const rankClass = i===0?'rank-1':(i===1?'rank-2':'rank-3');
        h += `<div class="podium-col ${rankClass}">`;
        h += `<div class="podium-name">${escapeHtml(s.name)}</div>`;
        h += `<div class="podium-pct">${Math.round(s.ratio*100)}%</div>`;
        h += `<div class="podium-bar">${i===0?'🎾':''}</div>`;
        h += '</div>';
      });
      h += '</div>';
    }

    h += '<div class="card">';
    h += '<h2>Classement</h2>';
    stats.forEach((s, i)=>{
      h += '<div class="rank-row">';
      h += `<div class="rank-num">${i+1}</div>`;
      h += '<div class="rank-info">';
      h += `<div class="rank-name">${escapeHtml(s.name)}</div>`;
      h += `<div class="rank-sub">${s.played} partie${s.played>1?'s':''} jouée${s.played>1?'s':''} · ${s.wins} victoire${s.wins>1?'s':''}</div>`;
      if(s.played>0){
        h += `<div class="rank-bar-track"><div class="rank-bar-fill" style="width:${Math.round(s.ratio*100)}%"></div></div>`;
      }
      h += '</div>';
      h += `<div class="rank-pct">${s.played>0 ? Math.round(s.ratio*100)+'%' : '—'}</div>`;
      h += '</div>';
    });
    h += '</div>';

    return h;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function bindEvents(){
    const app = document.getElementById('app');

    const dateInput = document.getElementById('dateInput');
    if(dateInput){
      dateInput.addEventListener('change', e=>{ selectedDate = e.target.value; render(); });
    }
    const newPlayerInput = document.getElementById('newPlayerInput');
    if(newPlayerInput){
      newPlayerInput.addEventListener('input', e=>{ newPlayerName = e.target.value; });
      newPlayerInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ submitNewPlayer(); } });
    }

    app.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        const action = el.getAttribute('data-action');
        if(action==='tab'){ activeTab = el.getAttribute('data-tab'); render(); }
        else if(action==='pick'){ togglePlayerSelect(el.getAttribute('data-id')); }
        else if(action==='win'){ toggleWinner(el.getAttribute('data-id')); }
        else if(action==='addPlayer'){ submitNewPlayer(); }
        else if(action==='save'){ await saveMatch(); }
        else if(action==='delMatch'){ await deleteMatch(el.getAttribute('data-id')); }
        else if(action==='filter'){ statsFilter = el.getAttribute('data-filter'); render(); }
        else if(action==='periodPrev'){ if(statsFilter==='week') weekOffset--; else monthOffset--; render(); }
        else if(action==='periodNext'){
          if(statsFilter==='week' && weekOffset<0){ weekOffset++; render(); }
          else if(statsFilter==='month' && monthOffset<0){ monthOffset++; render(); }
        }
      });
    });
  }

  async function submitNewPlayer(){
    const input = document.getElementById('newPlayerInput');
    const name = input ? input.value : newPlayerName;
    if(!name || !name.trim()) return;
    const id = addPlayer(name);
    if(id && selectedPlayers.length<4 && !selectedPlayers.includes(id)){
      selectedPlayers.push(id);
    }
    newPlayerName = '';
    await save();
    render();
  }

  initSupabase();
})();
</script>
</body>
</html>
